services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: srunal
      POSTGRES_USER: srunal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srunal -d srunal"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/bin/migrate"]
    environment:
      SRUNAL_DATABASE_URL: postgres://srunal:${POSTGRES_PASSWORD}@db:5432/srunal?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SRUNAL_ADDR: ":8080"
      SRUNAL_FARM_STARS_ENABLED: ${SRUNAL_FARM_STARS_ENABLED:-0}
      SRUNAL_DATABASE_URL: postgres://srunal:${POSTGRES_PASSWORD}@db:5432/srunal?sslmode=disable
      SRUNAL_BOT_TOKEN: ${SRUNAL_BOT_TOKEN}
      SRUNAL_WEBHOOK_SECRET: ${SRUNAL_WEBHOOK_SECRET}
      SRUNAL_BOT_ID: ${SRUNAL_BOT_ID}
      SRUNAL_CONTENT_KEY: ${SRUNAL_CONTENT_KEY}
      SRUNAL_IDENTITY_KEY: ${SRUNAL_IDENTITY_KEY}
      SRUNAL_DELIVERY_KEY: ${SRUNAL_DELIVERY_KEY}
      SRUNAL_HMAC_INDEX_KEY: ${SRUNAL_HMAC_INDEX_KEY}
      SRUNAL_MINIAPP_NAME: ${SRUNAL_MINIAPP_NAME}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/bin/worker"]
    environment:
      SRUNAL_DATABASE_URL: postgres://srunal:${POSTGRES_PASSWORD}@db:5432/srunal?sslmode=disable
      SRUNAL_BOT_TOKEN: ${SRUNAL_BOT_TOKEN}
      SRUNAL_DELIVERY_KEY: ${SRUNAL_DELIVERY_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
